name: Deploy schema + data to Supabase

on:
  push:
    branches: [main]
    paths:
      - "schema.sql"
      - "seed.sql"
      - "data/**"
      - ".github/workflows/deploy-db.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Decrypt hunt data
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:DATA_KEY -in data/locations.csv.enc -out /tmp/locations.csv
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:DATA_KEY -in data/routes.csv.enc -out /tmp/routes.csv

      - name: Apply schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f schema.sql

      - name: Seed teams + starting progress
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f seed.sql

      - name: Reset chat + progress
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f data/reset.sql

      - name: Load locations + routes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f data/load.sql
